<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light"><title>未来制造 · 三维教学图谱</title>
  <link rel="stylesheet" href="styles.css?v=1.1.1">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
  <script defer src="vendor/jszip.min.js"></script><script defer src="graph-core.js?v=1.1.1"></script><script defer src="table-reader.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="identity"><div><h1>未来制造虚拟仿真实验<span>三维教学图谱</span></h1><p id="course-title">智能制造产线模块化设计及控制虚拟仿真实验</p></div></div>
    <div class="header-actions"><span class="demo-badge">课程图谱</span><button id="import-open">导入数据</button><button id="export-data">导出配置</button></div>
  </header>
  <main class="workspace">
    <aside class="catalog" aria-label="节点目录">
      <div class="catalog-top"><h2>探索图谱</h2><button id="catalog-close" aria-label="关闭目录">×</button></div>
      <label class="search"><span>搜索节点</span><input id="search" type="search" placeholder="名称、知识点、编号" autocomplete="off"></label>
      <div class="catalog-summary" id="catalog-count">34 个节点 · 5 个层级</div>
      <nav id="node-list" aria-label="按层级浏览节点"></nav>
      <div class="catalog-bottom"><span class="dot pending"></span>待补充资源保留状态标签<br><small>标准定义不代表学生已经达成能力。</small></div>
    </aside>
    <section class="scene-panel" aria-label="三维教学关系图">
      <div class="scene-toolbar"><div class="toolbar-start"><button id="catalog-open">节点目录</button><div class="segmented" aria-label="关系范围"><button data-scope="path" aria-pressed="true">跨层关联</button><button data-scope="direct" aria-pressed="false">直接关系</button></div></div><button id="clear-selection" class="quiet">查看全图</button></div>
      <div id="scene" tabindex="0" aria-label="三维图谱。拖动旋转、滚轮缩放、右键平移。也可使用目录和视角按钮。">
        <div id="scene-loading" role="status">正在构建三维图谱…</div>
        <div id="labels"></div><div id="edge-label" hidden></div><div id="hover-tip" hidden></div>
        <div class="scene-title" hidden><strong id="scene-caption">分析优化</strong><span id="scene-subtitle">点击节点查看上下游关联</span></div>
        <div class="view-controls" aria-label="视角控制"><button data-view="perspective" aria-pressed="true">立体</button><button data-view="front" aria-pressed="false">正视</button><button data-view="top" aria-pressed="false">俯视</button><span></span><button id="zoom-in" aria-label="放大图谱">＋</button><button id="zoom-out" aria-label="缩小图谱">−</button><button id="reset-view">复位</button></div>
        <div class="scene-options"><label><input id="only-related" type="checkbox">仅显示关联</label><label><input id="show-labels" type="checkbox" checked>节点标签</label><label><input id="auto-rotate" type="checkbox">自动旋转</label><label class="spacing-control">层间距 <input id="layer-spacing" type="range" min="6" max="11" step=".05" value="8.55" aria-label="层间距"></label></div>
        <div id="fallback" hidden><h2>当前浏览器无法创建三维画布</h2><p>请启用浏览器硬件加速后重新打开。节点目录和关系详情仍可查看。</p><button id="retry">重新加载</button></div>
      </div>
      <footer class="scene-footer"><div class="legend"><span><i class="incoming"></i>上游关联</span><span><i class="outgoing"></i>下游关联</span><span><i class="background"></i>其他关系</span></div><span id="graph-stats" role="status" aria-live="polite"></span><span class="interaction-hint">拖动旋转 · 滚轮缩放 · 右键平移</span></footer>
    </section>
    <aside class="detail-panel" aria-label="节点与关联详情" hidden><button id="detail-close" class="detail-close" aria-label="关闭详情">×</button><div id="detail"></div></aside>
  </main>
  <dialog id="import-dialog"><form method="dialog"><div class="dialog-heading"><h2>导入图谱数据</h2><button aria-label="关闭导入">关闭</button></div></form><p>使用已有模板，一次导入课程、节点、关系、能力标准、证据和来源。</p><div class="template-links"><a href="data/graph-template.xlsx" download>下载 Excel 模板</a><a href="data/graph-data.json" download>下载示例 JSON</a></div><label class="file-picker">选择 .xlsx / .csv / .json 文件<input id="file-input" type="file" accept=".xlsx,.csv,.json"></label><div id="import-result" role="status"></div><div class="dialog-actions"><button id="restore-sample">恢复示例</button><button id="apply-import" class="primary" disabled>应用到图谱</button></div><p class="fine-print">本 Demo 将配置保存在当前浏览器，未连接业务数据库。</p></dialog>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="app.js?v=1.1.1"></script>
</body></html>
